{{ define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</div>
{{- with .RegularPages.ByDate.Reverse }}
<ul class="post-list">
  {{- range . }}
  <li>
    <time class="caps" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <a href="{{ .RelPermalink }}">
      <span class="post-title">{{ .Title }}</span>
      {{- with .Description }}<span class="post-desc">{{ . }}</span>{{ end }}
    </a>
  </li>
  {{- end }}
</ul>
{{- else }}
<p class="empty">Nothing here yet.</p>
{{- end }}
{{ end }}
