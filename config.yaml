baseURL: "https://jesrav.github.io/personal-site"
locale: "en-us"
title: "Jes Ravnbøl"
disableKinds: ["taxonomy", "term"]

params:
  # Theme for first-time visitors: "dark", "light", or "auto" (follow their system).
  # A visitor who uses the toggle keeps their own choice.
  defaultTheme: "dark"
  description: "I build agentic AI systems, and the evals and observability that prove they work. Freelance, based in Copenhagen."
  email: "mail@jesravnbol.dk"
  social:
    - name: GitHub
      url: "https://github.com/jesrav"
    - name: LinkedIn
      url: "https://linkedin.com/in/jes-ravnbøl-7b2092111"

menu:
  main:
    # A url starting with "#" is a section on the home page.
    - name: Projects
      url: "#projects"
      weight: 10
    # Hidden automatically until the first article is published.
    - name: Articles
      pageRef: /articles
      weight: 20

markup:
  highlight:
    style: nord
